<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경로 목록 가독성 보완</title><style>body{margin:24px;background:#f2f3f5;color:#172238;font:15px/1.6 system-ui}main{max-width:1650px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:white;border-radius:12px;overflow:hidden}figcaption{padding:10px;font-weight:600}img{width:100%;display:block}h2{font-size:20px}@media(max-width:850px){.pair{grid-template-columns:1fr}}</style><main><h1>정지 상태 경로 목록 · 가독성 우선</h1><p>2026-10-23 Chief 지시 반영. 입문·퍼블릭·내 경로는 불투명 흰 패널과 어두운 글자. 주행 중 라이더 순위 표시는 기존 투명 배경 유지.</p><h2>입문</h2><div class="pair"><figure><figcaption>이전 · 실제 App(에뮬레이터)</figcaption><img src="evidence/batch1-live-intro-800x360.png" alt="이전 입문"></figure><figure><figcaption>보완 · 실제 App(에뮬레이터)</figcaption><img src="evidence/route-list-surface/batch1-live-intro-800x360.png" alt="보완 입문"></figure></div><h2>퍼블릭</h2><div class="pair"><figure><figcaption>이전 · 실제 App(에뮬레이터)</figcaption><img src="evidence/batch1-live-public-800x360.png" alt="이전 퍼블릭"></figure><figure><figcaption>보완 · 실제 App(에뮬레이터)</figcaption><img src="evidence/route-list-surface/batch1-live-public-800x360.png" alt="보완 퍼블릭"></figure></div><h2>내 경로</h2><div class="pair"><figure><figcaption>이전 · 실제 App(에뮬레이터)</figcaption><img src="evidence/batch1-live-saved-800x360.png" alt="이전 내 경로"></figure><figure><figcaption>보완 · 실제 App(에뮬레이터)</figcaption><img src="evidence/route-list-surface/batch1-live-saved-800x360.png" alt="보완 내 경로"></figure></div><h2>내 경로 · 항목과 관리 도구가 있는 상태</h2><figure><figcaption>실제 제품 컴포넌트 · 메모리 예시 데이터 · 800×360</figcaption><img src="evidence/route-list-surface/batch1-preview-saved-800x360.png" alt="내 경로 관리 도구"></figure><p>실앱 에뮬레이터의 내 경로는 빈 상태이며, 항목·선택·이름 변경·삭제·이어달리기는 예시 데이터 프리뷰로 함께 확인했다. 지도와 목록 데이터는 촬영 시점에 따라 다르다.</p></main></html>
