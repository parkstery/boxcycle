<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경로창 버튼·원 펄스</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --ink: #1f2937; --muted: #5e6472; --line: #d9dde3; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14161a; --card: #1e2127; --ink: #e8eaee; --muted: #a2a8b3; --line: #343841; --accent: #7aa7ff; } }
  :root[data-theme="dark"] { --bg: #14161a; --card: #1e2127; --ink: #e8eaee; --muted: #a2a8b3; --line: #343841; --accent: #7aa7ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p.lead { margin: 0 0 20px; color: var(--muted); font-size: 18px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  figcaption { font-weight: 700; font-size: 18px; margin-bottom: 10px; }
  figcaption span { display: block; font-weight: 400; font-size: 15px; color: var(--muted); }
  video, img { width: 100%; height: auto; display: block; border-radius: 8px; background: #000; }
  .frames { margin-top: 16px; }
  ul { margin: 8px 0 0; padding-left: 20px; font-size: 17px; }
  .pairs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 900px) { .pairs { grid-template-columns: 1fr; } }
  .crop { aspect-ratio: 330 / 250; overflow: hidden; border-radius: 8px; background: #e8ecf3; position: relative; }
  .crop img { position: absolute; left: 0; top: 0; width: calc(100% * 800 / 330); max-width: none; border-radius: 0; background: none; }
  li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>경로창 맨 아래 — 「▶ 주행」 · 「경로 삭제」 알약</h1>
  <p class="lead">녹색 원 아이콘만 있던 재생 버튼과 글자뿐인 「경로 삭제」를 같은 흰 알약으로 맞췄다. Start·End와 거리·방향 두 탭 모두 같다(주행할 수 없을 때는 「주행」이 흐려진다).</p>
  <div class="pairs">
    <figure><figcaption>전 — Start·End</figcaption><div class="crop"><img src="evidence/instruction87/before-ready-start-800x360.png" alt="변경 전 Start·End 경로창"></div></figure>
    <figure><figcaption>후 — Start·End (주행 가능)</figcaption><div class="crop"><img src="evidence/instruction87/after-ready-start-800x360.png" alt="변경 후 Start·End 경로창"></div></figure>
    <figure><figcaption>전 — 거리·방향</figcaption><div class="crop"><img src="evidence/instruction87/before-distance-800x360.png" alt="변경 전 거리·방향 경로창"></div></figure>
    <figure><figcaption>후 — 거리·방향 (방향 전, 주행 흐림)</figcaption><div class="crop"><img src="evidence/instruction87/after-distance-800x360.png" alt="변경 후 거리·방향 경로창"></div></figure>
  </div>

  <h1 style="margin-top:40px">거리·방향 — 원과 화살표 펄스</h1>
  <p class="lead">거리를 고르면 원과 바깥 화살표 12개가 함께 커졌다 작아지기를 반복한다. 방향을 누르거나 거리 선택을 바꾸면 멈추고 원래 크기로 돌아온다.</p>
  <div class="grid">
    <figure>
      <figcaption>Chief 참고 영상<span>pulsing.mp4 — 약 1.5초 주기</span></figcaption>
      <video src="evidence/instruction86/reference-pulsing.mp4" autoplay loop muted playsinline></video>
    </figure>
    <figure>
      <figcaption>구현 (800×360 미리보기, 목표 거리 3km)<span>주기 1.5초 · 반지름 1.0 → 1.1배 · 점선 원·화살표 모양과 색은 그대로</span></figcaption>
      <video id="after" src="evidence/instruction86/after-pulse-800x360.webm" autoplay loop muted playsinline></video>
    </figure>
  </div>
  <figure class="frames">
    <figcaption>구현 프레임 6장(약 0.3초 간격)<span>3번째·5번째에서 원과 화살표가 함께 커져 있다</span></figcaption>
    <img src="evidence/instruction86/after-pulse-frames.png" alt="구현 펄스 프레임 6장">
    <ul>
      <li>미리보기 하네스는 지도 타일 대신 단색 배경, 원 전체가 보이도록 캡처 때만 줌아웃했다.</li>
      <li>「동작을 줄이기」(reduced motion) 설정에서는 움직이지 않는다.</li>
      <li>바꾼 것은 원·화살표 크기 애니메이션뿐 — 경로 탐색·좌표·카메라·요청은 그대로다.</li>
    </ul>
  </figure>
</main>
<script>
  // 녹화 앞부분(지도 로딩·조작)은 건너뛰고 펄스 구간만 반복한다.
  const v = document.getElementById("after");
  const skip = () => { if (Number.isFinite(v.duration) && v.duration > 6 && v.currentTime < v.duration - 4.2) v.currentTime = v.duration - 4.2; };
  v.addEventListener("loadedmetadata", skip);
  v.addEventListener("timeupdate", skip);
</script>
</body>
</html>
