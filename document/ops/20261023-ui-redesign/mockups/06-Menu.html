</g>

<path d="M480 -10 C 470 120, 520 240, 600 370"></path>

<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #2457D6"></span>
<span style="font-size: 15px; font-weight: 700; flex-grow: 1">Spinatlas</span>
<button type="button" aria-label="메뉴 닫기" style="width: 34px; height: 34px; border: 0; background: #F2F3F5; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></button>
</header>

<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #5E6472; margin-top: 4px">경로</span>
<ul style="list-style: none; margin: 0; padding: 0">
<li style="border-bottom: 1px solid #EEF0F3"><button type="button" style="width: 100%; height: 34px; border: 0; background: transparent; font: inherit; display: flex; align-items: center; gap: 10px; padding: 0; text-align: left">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13l4-9 4 6 2-3 2 6"></path></svg>
<span style="font-size: 13px; font-weight: 600; flex-grow: 1">입문 경로</span>
<span style="font-size: 11px; color: #5E6472">처음이라면</span>
<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#5E6472" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg></button></li>
<li style="border-bottom: 1px solid #EEF0F3"><button type="button" style="width: 100%; height: 34px; border: 0; background: transparent; font: inherit; display: flex; align-items: center; gap: 10px; padding: 0; text-align: left">

<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#5E6472" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg></button></li>
<li style="border-bottom: 1px solid #EEF0F3"><button type="button" style="width: 100%; height: 34px; border: 0; background: transparent; font: inherit; display: flex; align-items: center; gap: 10px; padding: 0; text-align: left">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h8v12l-4-3-4 3z"></path></svg>
<span style="font-size: 13px; font-weight: 600; flex-grow: 1">내 경로</span>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 14px; font-weight: 600; color: #4B5160">7</span>
<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#5E6472" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg></button></li>
<li style="border-bottom: 1px solid #EEF0F3"><button type="button" style="width: 100%; height: 34px; border: 0; background: transparent; font: inherit; display: flex; align-items: center; gap: 10px; padding: 0; text-align: left">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
<span style="font-size: 13px; font-weight: 600; flex-grow: 1">지명 검색</span>
<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#5E6472" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg></button></li>
<li style="border-bottom: 1px solid #EEF0F3"><button type="button" style="width: 100%; height: 34px; border: 0; background: transparent; font: inherit; display: flex; align-items: center; gap: 10px; padding: 0; text-align: left">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2 14V9h4v5M6 14V4h4v10M10 14V7h4v7"></path></svg>
<span style="font-size: 13px; font-weight: 600; flex-grow: 1">순위</span>
<span style="font-size: 11px; color: #5E6472">이번 주 <b style="font-family: 'Saira Condensed', sans-serif; font-size: 14px; color: #2457D6">1</b>위</span>
<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#5E6472" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg></button></li>
<li><button type="button" style="width: 100%; height: 34px; border: 0; background: transparent; font: inherit; display: flex; align-items: center; gap: 10px; padding: 0; text-align: left">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"></path><circle cx="5" cy="4" r="1.6" fill="#FFFFFF"></circle><circle cx="11" cy="8" r="1.6" fill="#FFFFFF"></circle><circle cx="7" cy="12" r="1.6" fill="#FFFFFF"></circle></svg>
<span style="font-size: 13px; font-weight: 600; flex-grow: 1">주행 설정</span>
<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#5E6472" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg></button></li>
</ul>

<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #5E6472; margin-top: 10px">지금 달리는 Trail</span>
<ul style="list-style: none; margin: 0; padding: 0">
<li style="display: flex; align-items: center; gap: 8px; height: 34px; border-bottom: 1px solid #EEF0F3">
<span style="font-size: 13px; font-weight: 600; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Vondelpark 한 바퀴</span>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 14px; font-weight: 600; color: #4B5160">2.0 <span style="font-size: 10px">km</span></span>
<button type="button" style="height: 24px; padding: 0 9px 0 7px; border: 0; background: #E6F4EC; font: inherit; font-size: 11px; font-weight: 700; color: #1E7A46; border-radius: 12px; display: flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #1E9A55"></span>2명 · 합류</button>

<button type="button" style="height: 24px; padding: 0 9px 0 7px; border: 0; background: #E6F4EC; font: inherit; font-size: 11px; font-weight: 700; color: #1E7A46; border-radius: 12px; display: flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #1E9A55"></span>1명 · 합류</button>
