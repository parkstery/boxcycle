<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>케이던스 센서</title>
<!-- 시안: 9. 케이던스 센서 · 폰 가로 800×360 을 2배(1600×720)로 그림. 원본 캔버스 https://claude.ai/artifact/NWrpXU7boGovvs8EixVcdN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457D6}a:hover{color:#163E9E}
</style>
</head>
<body>
<div style="width: 1600px; height: 720px; overflow: hidden; background: #2E3A2F; font-family: 'Gothic A1', system-ui, sans-serif; color: #121417">
<div style="zoom: 2; width: 800px; height: 360px; display: flex; align-items: center; justify-content: center">
<section aria-label="케이던스 센서" style="width: 560px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,0.28); display: grid; grid-template-columns: 220px minmax(0, 1fr); overflow: hidden">
<div style="background: #EEF3FC; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; justify-content: center">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #5E6472">케이던스</span>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 72px; font-weight: 700; line-height: 0.95; color: #2457D6">82<span style="font-size: 22px; font-weight: 600"> RPM</span></span>
<span style="font-size: 12px; color: #4B5160; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #1E9A55"></span>연결됨 · Wahoo CADENCE</span>
</div>
<div style="padding: 12px 14px 14px 18px; display: flex; flex-direction: column; gap: 8px">
<header style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 15px; font-weight: 700; flex-grow: 1">케이던스 센서</span>
<button type="button" aria-label="닫기" style="width: 34px; height: 34px; border: 0; background: #F2F3F5; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></button>
</header>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #121417">페달을 돌리면 왼쪽 숫자가 바뀌어요.<br>센서로 달린 주행만 순위에 올라가요.</p>
<div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #EEF0F3; padding-top: 8px">
<span style="font-size: 12px; color: #4B5160">센서 없이 달리기 <span style="font-size: 11px; color: #5E6472">· 순위 제외</span></span>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="체험 속도 줄이기" style="width: 30px; height: 30px; border: 1px solid #C9D6EE; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"></path></svg></button>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 17px; font-weight: 600; min-width: 54px; text-align: center">20 <span style="font-size: 11px; color: #5E6472">km/h</span></span>
<button type="button" aria-label="체험 속도 늘리기" style="width: 30px; height: 30px; border: 1px solid #C9D6EE; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10M8 3v10"></path></svg></button>
</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px">
<button type="button" style="height: 36px; padding: 0 8px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: #4B5160">연결 해제</button>
<button type="button" style="height: 40px; padding: 0 20px; border: 0; background: #2457D6; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; border-radius: 10px">이 센서로 달리기</button>
</div>
</div>
</section>
</div>
</div>
</body>
</html>
