<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프로필 수정</title>
<!-- 시안: 12. 프로필 수정 · 폰 가로 800×360 을 2배(1600×720)로 그림. 원본 캔버스 https://claude.ai/artifact/NWrpXU7boGovvs8EixVcdN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457D6}a:hover{color:#163E9E}
</style>
</head>
<body>
<div style="width: 1600px; height: 720px; overflow: hidden; background: #2E3A2F; font-family: 'Gothic A1', system-ui, sans-serif; color: #121417">
<div style="zoom: 2; width: 800px; height: 360px; display: flex; align-items: center; justify-content: center">
<section aria-label="프로필 수정" style="width: 520px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,0.28); padding: 12px 16px 14px 20px; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 8px; padding-bottom: 4px">
<span style="font-size: 15px; font-weight: 700; flex-grow: 1">프로필 수정</span>
<button type="button" aria-label="닫기" style="width: 34px; height: 34px; border: 0; background: #F2F3F5; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></button>
</header>

<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; column-gap: 12px; padding: 8px 0; border-bottom: 1px solid #EEF0F3">
<label for="nick" style="font-size: 12px; font-weight: 600; color: #4B5160">닉네임</label>
<input id="nick" value="Ridingman12" style="height: 34px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9D6EE; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; color: #121417">
<span></span>
<span style="font-size: 11px; line-height: 15px; color: #5E6472; padding-top: 4px">바꾸면 30일 동안 다시 바꿀 수 없어요</span>
</div>

<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 48px; border-bottom: 1px solid #EEF0F3">
<span style="font-size: 12px; font-weight: 600; color: #4B5160">체중</span>
<input type="range" min="30" max="300" value="64" aria-label="체중" style="accent-color: #2457D6; width: 100%">
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" aria-label="1 kg 줄이기" style="width: 30px; height: 30px; border: 1px solid #C9D6EE; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"></path></svg></button>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #2457D6; min-width: 56px; text-align: center">64 <span style="font-size: 11px; font-weight: 600">kg</span></span>
<button type="button" aria-label="1 kg 늘리기" style="width: 30px; height: 30px; border: 1px solid #C9D6EE; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10M8 3v10"></path></svg></button>
</div>
</div>

<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; column-gap: 12px; min-height: 48px; border-bottom: 1px solid #EEF0F3">
<span style="font-size: 12px; font-weight: 600; color: #4B5160">운동 강도</span>
<div role="group" aria-label="운동 강도" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: #F2F3F5; border-radius: 10px; padding: 3px">
<button type="button" style="height: 28px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 600; color: #4B5160; border-radius: 8px">아주 약하게</button>
<button type="button" style="height: 28px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 600; color: #4B5160; border-radius: 8px">약하게</button>
<button type="button" aria-pressed="true" style="height: 28px; border: 0; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; color: #2457D6; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.12)">보통</button>
<button type="button" style="height: 28px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 600; color: #4B5160; border-radius: 8px">강하게</button>
<button type="button" style="height: 28px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 600; color: #4B5160; border-radius: 8px">아주 강하게</button>
</div>
</div>

<p style="margin: 8px 0 0; font-size: 11px; line-height: 15px; color: #5E6472">체중과 운동 강도는 칼로리 계산에만 써요. 나만 볼 수 있어요.</p>

<div style="display: flex; align-items: center; gap: 8px; margin-top: 12px">
<button type="button" style="height: 32px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 11px; font-weight: 600; color: #5E6472; text-decoration: underline">계정 탈퇴</button>
<span style="flex-grow: 1"></span>
<button type="button" style="height: 36px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: #4B5160">취소</button>
<button type="button" style="height: 40px; padding: 0 24px; border: 0; background: #2457D6; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; border-radius: 10px">저장</button>
</div>
</section>
</div>
</div>
</body>
</html>
