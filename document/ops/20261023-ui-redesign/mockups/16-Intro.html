<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}

<div style="width: 1600px; height: 720px; overflow: hidden; background: #2E3A2F; font-family: 'Gothic A1', system-ui, sans-serif; color: #121417">

<rect width="800" height="360" fill="#2E3A2F"></rect>
<ellipse cx="600" cy="190" rx="150" ry="85" fill="#35503C"></ellipse>
<path d="M300 330 C 420 280, 520 310, 640 250 S 760 200, 820 210" stroke="#3E6B8A" stroke-width="20" stroke-opacity="0.6"></path>
<g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2">
<path d="M300 60 H800 M300 130 H800 M300 280 H800 M480 0 V360 M620 0 V360 M740 0 V360"></path>
</g>
<g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round">

<section aria-label="앱 소개" style="position: absolute; left: 0; top: 0; width: 360px; height: 360px; box-sizing: border-box; background: #FFFFFF; border-radius: 0 18px 18px 0; box-shadow: 0 6px 24px rgba(0,0,0,0.28); padding: 22px 28px 20px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #2457D6"></span>
<span style="font-size: 15px; font-weight: 800; letter-spacing: 0.02em">Spinatlas</span>
</div>
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #5E6472; margin-top: 30px">실내 자전거 · 실제 도로</span>
<h1 style="margin: 6px 0 0; font-size: 26px; font-weight: 800; line-height: 34px; letter-spacing: -0.01em">땀으로 그리는,<br>나만의 지구 지도.</h1>
<p style="margin: 10px 0 0; font-size: 13px; line-height: 19px; color: #4B5160">실내 자전거로 실제 도로를 달리면,<br>달린 길이 내 지도에 남아요.</p>
<div style="margin-top: auto; display: flex; gap: 8px; align-items: center">
<button type="button" style="height: 44px; padding: 0 22px; border: 0; background: #2457D6; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; border-radius: 10px">게스트로 시작</button>
<button type="button" style="height: 40px; padding: 0 16px; border: 1px solid #C9D6EE; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; color: #2A2E37; border-radius: 999px; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-weight: 800; color: #2A2E37">G</span>Google로 로그인</button>
</div>
<p style="margin: 10px 0 0; font-size: 11px; line-height: 15px; color: #5E6472">게스트 기록은 나중에 회원 등록해도 그대로 이어져요.</p>
</section>

<span style="position: absolute; left: 580px; bottom: 3px; transform: translateX(-50%); font-size: 9px; color: rgba(255,255,255,0.7)">© Mapbox © OpenStreetMap</span>
