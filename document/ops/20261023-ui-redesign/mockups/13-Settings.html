<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주행 설정</title>
<!-- 시안: 10. 주행 설정 · 폰 가로 800×360 을 2배(1600×720)로 그림. 원본 캔버스 https://claude.ai/artifact/NWrpXU7boGovvs8EixVcdN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457D6}a:hover{color:#163E9E}
</style>
</head>
<body>
<div style="width: 1600px; height: 720px; overflow: hidden; background: #2E3A2F; font-family: 'Gothic A1', system-ui, sans-serif; color: #121417">
<div style="zoom: 2; width: 800px; height: 360px; display: flex; align-items: center; justify-content: center">
<section aria-label="주행 설정" style="width: 520px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,0.28); padding: 12px 16px 14px 20px; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 8px; padding-bottom: 4px">
<span style="font-size: 15px; font-weight: 700; flex-grow: 1">주행 설정</span>
<button type="button" aria-label="주행 설정 닫기" style="width: 34px; height: 34px; border: 0; background: #F2F3F5; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></button>
</header>
<ul style="list-style: none; margin: 0; padding: 0">
<li style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #EEF0F3">
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">코칭 문구</span><span style="font-size: 11px; color: #5E6472">주행 중 화면 아래에 짧게 보여요</span></div>
<button type="button" role="switch" aria-checked="true" aria-label="코칭 문구" style="width: 40px; height: 24px; border: 0; padding: 2px; background: #2457D6; border-radius: 999px; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></button>
</li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #EEF0F3">
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">음성 안내</span></div>
<button type="button" role="switch" aria-checked="true" aria-label="음성 안내" style="width: 40px; height: 24px; border: 0; padding: 2px; background: #2457D6; border-radius: 999px; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></button>
</li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #EEF0F3">
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">배경 음악</span></div>
<button type="button" role="switch" aria-checked="false" aria-label="배경 음악" style="width: 40px; height: 24px; border: 0; padding: 2px; background: #C9D6EE; border-radius: 999px; display: flex; justify-content: flex-start"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></button>
</li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #EEF0F3">
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">페이서</span></div>
<button type="button" role="switch" aria-checked="true" aria-label="페이서" style="width: 40px; height: 24px; border: 0; padding: 2px; background: #2457D6; border-radius: 999px; display: flex; justify-content: flex-end"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></button>
</li>
<li style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">칼로리 계산</span><span style="font-size: 11px; color: #5E6472">체중 <b style="font-family: 'Saira Condensed', sans-serif; font-size: 13px; color: #121417">64 kg</b> · 운동 강도 보통</span></div>
<button type="button" style="height: 30px; padding: 0 12px; border: 1px solid #C9D6EE; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; color: #2A2E37; border-radius: 999px">프로필 수정</button>
</li>
</ul>
</section>
</div>
</div>
</body>
</html>
