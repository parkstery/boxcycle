<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>일시정지</title>
<!-- 시안: 6. 일시정지 · 폰 가로 800×360 을 2배(1600×720)로 그림. 원본 캔버스 https://claude.ai/artifact/NWrpXU7boGovvs8EixVcdN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457D6}a:hover{color:#163E9E}
.o{paint-order:stroke fill;-webkit-text-stroke:3px #000000;text-shadow:0 1px 4px rgba(0,0,0,0.55)}
.o-l{color:#F8FAFC;font-size:11px;font-weight:700}
.o-v{color:#52C9FF;-webkit-text-stroke:4px #000000}
.o-h{color:#A8DCFF;-webkit-text-stroke:4px #000000}
.o-g{color:#6EE7A0}
.o-w{color:#F8FAFC}
</style>
</head>
<body>
<div style="width: 1600px; height: 720px; overflow: hidden; background: #2E3A2F; font-family: 'Gothic A1', system-ui, sans-serif; color: #121417">
<div style="zoom: 2; position: relative; width: 800px; height: 360px; overflow: hidden">
<svg aria-hidden="true" width="800" height="360" viewBox="0 0 800 360" fill="none" style="position: absolute; left: 0; top: 0">
<rect width="800" height="360" fill="#2E3A2F"></rect>
<ellipse cx="560" cy="150" rx="110" ry="60" fill="#3E6B8A" fill-opacity="0.6"></ellipse>
<ellipse cx="300" cy="140" rx="120" ry="70" fill="#35503C"></ellipse>
<g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2">
<path d="M0 70 H800 M0 300 H800 M120 0 V360 M680 0 V360"></path>
</g>
<g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round">
<path d="M-10 240 C 200 230, 420 250, 810 200"></path>
<path d="M640 -10 C 620 120, 660 240, 700 370"></path>
</g>
<path d="M400 370 C 400 300, 405 260, 420 230 S 470 120, 480 -10" stroke="#0E1F4D" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round"></path>
<path d="M400 370 C 400 300, 405 260, 420 230 S 470 120, 480 -10" stroke="#6E97FF" stroke-width="6" stroke-linecap="round"></path>
<path d="M400 370 C 400 320, 401 290, 405 262" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9"></path>
<circle cx="406" cy="258" r="13" fill="#FFFFFF" stroke="#2457D6" stroke-width="4"></circle>
<rect x="401" y="252" width="3" height="12" rx="1" fill="#2457D6"></rect><rect x="408" y="252" width="3" height="12" rx="1" fill="#2457D6"></rect>
</svg>

<section aria-label="주행 지표" style="position: absolute; left: 14px; top: 6px; display: flex; gap: 18px; align-items: flex-start">
<div style="display: flex; flex-direction: column; align-items: center"><span class="o o-l">거리</span><span class="o o-h" style="font-family: 'Saira Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">0.08<span class="o o-h" style="font-size: 15px"> / 2.02</span> <span class="o o-h" style="font-size: 12px">km</span></span></div>
<div style="display: flex; flex-direction: column; align-items: center"><span class="o o-l">시간</span><span class="o o-v" style="font-family: 'Saira Condensed', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.05">00:14</span></div>
<div style="display: flex; flex-direction: column; align-items: center"><span class="o o-l">평균</span><span class="o o-v" style="font-family: 'Saira Condensed', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.05">19.6 <span class="o o-v" style="font-size: 12px">km/h</span></span></div>
<div style="display: flex; flex-direction: column; align-items: center"><span class="o o-l o-g">새 도로</span><span class="o o-g" style="font-family: 'Saira Condensed', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.05">+0.08 <span class="o o-g" style="font-size: 12px">km</span></span></div>
</section>

<p role="status" class="o o-w" style="position: absolute; left: 50%; top: 74px; transform: translateX(-50%); margin: 0; font-size: 18px; font-weight: 800; white-space: nowrap">잠깐 멈췄어요</p>

<div style="position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; align-items: center">
<button type="button" aria-label="계정" style="width: 32px; height: 32px; border: 0; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.18)"><span style="width: 24px; height: 24px; border-radius: 50%; background: #EEF3FC; color: #2457D6; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">R</span></button>
</div>

<section aria-label="미니맵" style="position: absolute; left: 8px; bottom: 8px; width: 210px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.28); padding: 6px; display: flex; flex-direction: column; gap: 4px">
<svg aria-hidden="true" width="198" height="84" viewBox="0 0 198 84" fill="none" style="border-radius: 8px; background: #EEF3FC">
<path d="M14 70 C 40 60, 52 64, 70 50 S 90 30, 100 40 S 130 46, 160 36 S 180 30, 184 10" stroke="#C9D6EE" stroke-width="4" stroke-linecap="round"></path>
<path d="M14 70 C 30 64, 40 63, 48 59" stroke="#2457D6" stroke-width="4" stroke-linecap="round"></path>
<circle cx="48" cy="59" r="5" fill="#2457D6" stroke="#FFFFFF" stroke-width="2"></circle>
<circle cx="184" cy="10" r="4" fill="#121417"></circle>
</svg>
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 2px">
<span style="font-size: 11px; color: #4B5160">도착까지</span>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 17px; font-weight: 600">1.94 <span style="font-size: 11px; color: #5E6472">km</span></span>
</div>
</section>

<div style="position: absolute; right: 12px; bottom: 24px; display: flex; gap: 8px; align-items: center">
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #C9D6EE; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; color: #2A2E37; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,0.18)">경로 바꾸기</button>
<button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #C9D6EE; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; color: #2A2E37; border-radius: 999px; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.18)"><svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" fill="#2A2E37"></rect></svg>주행 끝내기</button>
<button type="button" style="height: 48px; padding: 0 22px 0 18px; border: 0; background: #2457D6; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; border-radius: 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.28)"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z" fill="#FFFFFF"></path></svg>다시 달리기</button>
</div>
</div>
</div>
</body>
</html>
