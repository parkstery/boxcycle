<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>맵 뷰</title>
<!-- 시안: 11. 맵 뷰 · 폰 가로 800×360 을 2배(1600×720)로 그림. 원본 캔버스 https://claude.ai/artifact/NWrpXU7boGovvs8EixVcdN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457D6}a:hover{color:#163E9E}
</style>
</head>
<body>
<div style="width: 1600px; height: 720px; overflow: hidden; background: #2E3A2F; font-family: 'Gothic A1', system-ui, sans-serif; color: #121417">
<div style="zoom: 2; position: relative; width: 800px; height: 360px; overflow: hidden">
<svg aria-hidden="true" width="800" height="360" viewBox="0 0 800 360" fill="none" style="position: absolute; left: 0; top: 0">
<rect width="800" height="360" fill="#2E3A2F"></rect>
<ellipse cx="250" cy="200" rx="150" ry="80" fill="#35503C"></ellipse>
<path d="M-20 320 C 160 270, 300 300, 460 240 S 700 190, 820 210" stroke="#3E6B8A" stroke-width="20" stroke-opacity="0.6"></path>
<g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2">
<path d="M0 60 H800 M0 130 H800 M0 280 H800 M90 0 V360 M380 0 V360"></path>
</g>
<g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round">
<path d="M-10 110 C 200 90, 420 140, 810 80"></path>
<path d="M120 370 C 200 250, 300 200, 470 180"></path>
</g>
<path d="M175 235 C 220 200, 250 210, 300 170 S 340 120, 360 150 S 420 170, 470 140" stroke="#6E97FF" stroke-width="4" stroke-linecap="round"></path>
</svg>

<aside aria-label="맵 뷰" style="position: absolute; right: 8px; top: 8px; width: 320px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,0.28); padding: 10px 14px 12px 18px; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 8px; height: 38px">
<span style="font-size: 15px; font-weight: 700; flex-grow: 1">맵 뷰</span>
<button type="button" aria-label="맵 뷰 닫기" style="width: 34px; height: 34px; border: 0; background: #F2F3F5; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></button>
</header>

<div style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid #EEF0F3">
<span style="font-size: 12px; font-weight: 600; width: 52px; color: #4B5160">도로망</span>
<div role="group" aria-label="도로망 표시" style="display: flex; gap: 4px; background: #F2F3F5; border-radius: 10px; padding: 3px; flex-grow: 1">
<button type="button" aria-pressed="true" style="flex: 1 1 0; height: 28px; border: 0; background: #2457D6; font: inherit; font-size: 12px; font-weight: 700; color: #FFFFFF; border-radius: 8px">내 도로망 전체</button>
<button type="button" style="flex: 1 1 0; height: 28px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 600; color: #4B5160; border-radius: 8px">새 도로만</button>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid #EEF0F3">
<span style="font-size: 12px; font-weight: 600; width: 52px; color: #4B5160">3D 뷰</span>
<span style="flex-grow: 1"></span>
<button type="button" role="switch" aria-checked="false" aria-label="3D 뷰" style="width: 40px; height: 24px; border: 0; padding: 2px; background: #C9D6EE; border-radius: 999px; display: flex; justify-content: flex-start"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></button>
</div>

<button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 6px; height: 36px; border: 0; background: transparent; padding: 0; font: inherit; font-size: 12px; font-weight: 700; color: #2A2E37; text-align: left">고급 설정 <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6l5 5 5-5"></path></svg></button>

<div style="display: flex; align-items: center; gap: 10px; min-height: 40px; border-bottom: 1px solid #EEF0F3">
<span style="font-size: 12px; font-weight: 600; width: 52px; color: #4B5160">노선</span>
<div role="group" aria-label="노선 비교" style="display: flex; gap: 4px; background: #F2F3F5; border-radius: 10px; padding: 3px; flex-grow: 1">
<button type="button" aria-pressed="true" style="flex: 1 1 0; height: 28px; border: 0; background: #2457D6; font: inherit; font-size: 12px; font-weight: 700; color: #FFFFFF; border-radius: 8px">끔</button>
<button type="button" style="flex: 1 1 0; height: 28px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 600; color: #4B5160; border-radius: 8px">도로 비교</button>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
<span style="font-size: 12px; font-weight: 600; width: 52px; color: #4B5160; line-height: 15px">주행 카메라 거리</span>
<button type="button" aria-label="한 눈금 가깝게" style="width: 30px; height: 30px; border: 1px solid #C9D6EE; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"></path></svg></button>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 17px; font-weight: 600; min-width: 52px; text-align: center">50.0 <span style="font-size: 11px; color: #5E6472">m</span></span>
<button type="button" aria-label="한 눈금 멀게" style="width: 30px; height: 30px; border: 1px solid #C9D6EE; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10M8 3v10"></path></svg></button>
<span style="font-size: 11px; color: #5E6472">주행 중에만</span>
</div>
</aside>
</div>
</div>
</body>
</html>
