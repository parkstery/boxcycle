<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주행 결과</title>
<!-- 시안: 7. 주행 결과 · 폰 가로 800×360 을 2배(1600×720)로 그림. 원본 캔버스 https://claude.ai/artifact/NWrpXU7boGovvs8EixVcdN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457D6}a:hover{color:#163E9E}
</style>
</head>
<body>
<div style="width: 1600px; height: 720px; overflow: hidden; background: #2E3A2F; font-family: 'Gothic A1', system-ui, sans-serif; color: #121417">
<div style="zoom: 2; width: 800px; height: 360px; display: flex; align-items: center; justify-content: center">
<section aria-label="주행 결과" style="width: 740px; height: 324px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; display: grid; grid-template-columns: 268px minmax(0, 1fr); overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,0.28)">
<div style="background: #EEF3FC; padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 700; line-height: 18px; color: #121417">첫 라이딩을 마치셨어요.<br>시작이 가장 어려운 법이에요.</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #5E6472">새 도로</span>
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 72px; font-weight: 700; line-height: 0.95; color: #2457D6">+0.16<span style="font-size: 22px; font-weight: 600"> km</span></span>
<span style="font-size: 12px; color: #4B5160">내 도로망 <b style="font-family: 'Saira Condensed', sans-serif; font-size: 15px; color: #121417">178.5 km</b>로 늘었어요</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: 'Saira Condensed', sans-serif; font-size: 26px; font-weight: 600; line-height: 1.1">0.2 <span style="font-size: 13px; color: #4B5160">/ 2.0 km</span></span>
<span style="font-size: 11px; color: #5E6472">남은 1.8 km</span>
</div>
<div aria-hidden="true" style="height: 4px; border-radius: 2px; background: #FFFFFF"><div style="width: 10%; height: 4px; border-radius: 2px; background: #2457D6"></div></div>
</div>
</div>
<div style="padding: 12px 16px 12px 18px; display: flex; flex-direction: column; min-width: 0">
<header style="display: flex; align-items: center; gap: 8px; padding-bottom: 4px">
<span style="font-size: 15px; font-weight: 700; flex-grow: 1">주행 결과</span>
<button type="button" aria-label="닫기" style="width: 34px; height: 34px; border: 0; background: #F2F3F5; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#2A2E37" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg></button>
</header>
<dl style="margin: 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; height: 34px; border-bottom: 1px solid #EEF0F3"><dt style="font-size: 13px; color: #4B5160">경로</dt><dd style="margin: 0; font-size: 13px; font-weight: 600">Vondelpark 2 → Prinsengracht 524</dd></div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 34px; border-bottom: 1px solid #EEF0F3"><dt style="font-size: 13px; color: #4B5160">시간</dt><dd style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-size: 17px; font-weight: 600">0 <span style="font-family: 'Gothic A1', sans-serif; font-size: 11px; color: #4B5160">분</span> 29 <span style="font-family: 'Gothic A1', sans-serif; font-size: 11px; color: #4B5160">초</span></dd></div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 34px; border-bottom: 1px solid #EEF0F3"><dt style="font-size: 13px; color: #4B5160">평균 속도</dt><dd style="margin: 0; font-family: 'Saira Condensed', sans-serif; font-size: 17px; font-weight: 600">19.7 <span style="font-size: 11px; color: #4B5160">km/h</span></dd></div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 34px; border-bottom: 1px solid #EEF0F3"><dt style="font-size: 13px; color: #4B5160">칼로리</dt><dd style="margin: 0; font-size: 12px; color: #4B5160"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; font-size: 12px; font-weight: 700; color: #2457D6">체중 입력</button> 후 표시</dd></div>
</dl>
<p style="margin: 10px 0 0; font-size: 11px; line-height: 15px; color: #5E6472">게스트 기록은 로그아웃하면 사라져요. 회원 등록하면 이번 주행과 내 도로망이 그대로 남아요.</p>
<div style="margin-top: auto; display: flex; align-items: center; justify-content: flex-end; gap: 8px">
<button type="button" style="height: 36px; padding: 0 8px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: #4B5160">저장 안 함</button>
<button type="button" style="height: 36px; padding: 0 16px; border: 1px solid #C9D6EE; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; color: #2A2E37; border-radius: 999px">내 경로로 저장</button>
<button type="button" style="height: 40px; padding: 0 20px; border: 0; background: #2457D6; font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; border-radius: 10px">회원 등록</button>
</div>
</div>
</section>
</div>
</div>
</body>
</html>
