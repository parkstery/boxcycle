<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:#f1f5f9;font:14px 'Pretendard Variable',system-ui,sans-serif;color:#0f172a;width:1680px}
h1{font-size:20px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
figure{margin:0;background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px #0002}
figcaption{font-weight:700;margin:0 0 6px}figcaption small{font-weight:400;color:#475569;display:block;margin-top:2px}
img{width:800px;height:360px;display:block;border-radius:6px}
</style></head><body><h1>순위 범위 선택 시안 — 폰 가로 800×360 (주황 점선 = 바뀌는 곳, 실제 순위 창 위에 그림)</h1><div class="grid">
<figure><figcaption>현재 — 「세계」 글자만<small>범위를 고를 수 없음</small></figcaption><img src="now-800x360.png"></figure>
<figure><figcaption>A안(추천) — 기간 버튼과 같은 꼴, 누를 때마다 세계 → 아시아 → 대한민국<small>창 크기·줄 수 그대로. 버튼 폭 51~75px. 그림은 「대한민국 ▾」 상태</small></figcaption><img src="a_country-800x360.png"></figure>
<figure><figcaption>A안 — 처음 열 때(세계 ▾)<small>개척 탭·국가 없는 사람(게스트 포함)은 ▾ 없이 「세계」 글자만(지금과 같음)</small></figcaption><img src="a_world-800x360.png"></figure>
<figure><figcaption>B안 — 세 칸 분할<small>한눈에 보이지만 158px, 닫기 버튼과 37px 남음</small></figcaption><img src="b-800x360.png"></figure>
</div></body></html>
