<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>지시04 minimap 70% + dock-above</title>
<style>
  html { font-size: 13.5px; }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #1a2332; color: #f8fafc; }
  .stage { position: relative; background: linear-gradient(135deg, #7a9a6a 0%, #4a6a40 40%, #2a4a30 100%); }
  .hud-glass {
    background: rgba(15, 23, 42, 0.42);
    border: 1px solid rgba(248, 250, 252, 0.18);
    border-radius: 12px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.22);
  }
  .map-hud__tl {
    position: absolute; top: 0.6rem; left: 0.6rem;
    display: flex; align-items: center; gap: 0.35rem;
  }
  .hud-brand {
    display: inline-flex; align-items: center; gap: 0.35rem;
    height: 2.1rem; padding: 0 0.7rem 0 0.55rem; border-radius: 999px;
    background: rgba(15,23,42,0.5); border: 1px solid rgba(248,250,252,0.18);
    font-weight: 700; font-size: 0.78rem;
  }
  .hud-brand__dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #E8A33D; }
  .metrics { font-size: 0.7rem; white-space: nowrap; }
  .map-hud__tr { position: absolute; top: 0.6rem; right: 0.6rem; display: flex; gap: 0.35rem; }
  .qc button {
    min-width: 2rem; height: 2rem; border-radius: 0.4rem;
    border: 1px solid rgba(255,255,255,0.22); background: rgba(15,23,42,0.55); color: #e2e8f0;
  }
  .account {
    height: 2rem; padding: 0 0.6rem; border-radius: 999px;
    border: 1px solid rgba(248,250,252,0.25); background: rgba(15,23,42,0.55); font-size: 0.72rem;
  }
  .route-dock-anchor {
    --route-dock-pad: 0.6rem;
    --mapbox-logo-clearance: 2.875rem;
    position: absolute; left: max(var(--route-dock-pad), 0px);
    bottom: calc(var(--route-dock-pad) + var(--mapbox-logo-clearance));
    z-index: 6;
  }
  .route-dock__shell {
    display: flex; border: 1px solid rgba(248,250,252,0.18);
    border-radius: 14px; background: rgba(10,16,26,0.64); overflow: hidden;
  }
  .route-dock__caret {
    width: 0.93rem; min-height: 44px; border: none; background: transparent; color: #f8fafc;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .route-dock__caret-led { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: #34d399; }
  .route-dock-anchor--open .route-dock__body {
    padding: 0.45rem 0.55rem; font-size: 0.65rem; width: 13rem; background: rgba(10,14,18,0.9);
  }
  .route-dock-anchor--open .route-dock__caret { min-height: 0; }

  .route-minimap-anchor {
    --route-dock-pad: 0.6rem;
    --mapbox-logo-clearance: 2.875rem;
    --mm-collapsed-dock-h: 3.4rem;
    --mm-gap-above-dock: 0.35rem;
    --mm-pad-top: 0.6rem;
    --mm-tl-block: 2.55rem;
    --mm-gap-after-tl: 0.35rem;
    --mm-top: calc(var(--mm-pad-top) + var(--mm-tl-block) + var(--mm-gap-after-tl));
    --mm-bottom-reserve: calc(
      var(--route-dock-pad) + var(--mapbox-logo-clearance) + var(--mm-collapsed-dock-h) + var(--mm-gap-above-dock)
    );
    position: absolute; z-index: 4;
    left: max(var(--route-dock-pad), 0px);
    top: var(--mm-top);
    bottom: var(--mm-bottom-reserve);
    width: 0; pointer-events: none; overflow: visible;
  }
  .route-minimap {
    position: absolute; left: 0; bottom: 0; top: auto; overflow: hidden; pointer-events: auto;
  }
  .route-minimap__svg { display: block; width: 100%; height: 100%; }
  .route-minimap__path-outline { stroke: rgba(2,6,23,0.92); stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .route-minimap__path { stroke: #f8fafc; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .route-minimap__endpoint { stroke: rgba(2,6,23,0.9); stroke-width: 1.25; }
  .route-minimap__endpoint--start { fill: #94a3b8; }
  .route-minimap__endpoint--end { fill: #e2e8f0; }
  .route-minimap__live { fill: #e8a33d; stroke: #f8fafc; stroke-width: 1.75; }

  .cmp-grid {
    position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; padding: 16px; background: #1e3a28;
  }
  .cmp-grid .cell { display: flex; flex-direction: column; gap: 6px; }
  .cmp-grid label { font-size: 11px; }
  .cmp-grid .frame { position: relative; flex: 1; background: #2a4a30; border-radius: 8px; overflow: hidden; min-height: 200px; }
  .zoom-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #2a4a30; }
  #measure-out { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
</style>
</head>
<body>
<pre id="measure-out"></pre>
<script>
const PAD = 6, MAX_COORDS = 1000;
const MINIMAP_WIDTH_RATIO = 0.294; // 0.42 × 0.7
const MINIMAP_WIDTH_RATIO_FULL = 0.42;

function boundsFromLineCoordinates(coords) {
  let minLng=Infinity,minLat=Infinity,maxLng=-Infinity,maxLat=-Infinity;
  for (const [lng,lat] of coords) {
    minLng=Math.min(minLng,lng); minLat=Math.min(minLat,lat);
    maxLng=Math.max(maxLng,lng); maxLat=Math.max(maxLat,lat);
  }
  return {minLng,minLat,maxLng,maxLat};
}
function sampleCoords(coords, maxCount) {
  const n = coords.length;
  if (n <= maxCount) return coords.slice();
  const out=[], last=n-1;
  for (let i=0;i<maxCount;i++) {
    const idx = i===maxCount-1 ? last : Math.round((i*last)/(maxCount-1));
    out.push(coords[idx]);
  }
  return out;
}
function projectRouteMinimap(coords, width, height, padPx=PAD) {
  if (!coords.length || !(width>0) || !(height>0)) return null;
  const sampled = sampleCoords(coords, MAX_COORDS);
  const b = boundsFromLineCoordinates(sampled);
  const midLat = (b.minLat+b.maxLat)/2;
  let cos = Math.cos((midLat*Math.PI)/180);
  if (!Number.isFinite(cos) || Math.abs(cos)<1e-6) cos=1e-6;
  const x0=b.minLng*cos, x1=b.maxLng*cos, y0=b.minLat, y1=b.maxLat;
  let dx=x1-x0, dy=y1-y0;
  const innerW=Math.max(1,width-2*padPx), innerH=Math.max(1,height-2*padPx);
  const EPS=1e-12;
  const degenerate = dx<EPS && dy<EPS;
  if (dx<EPS) dx=EPS; if (dy<EPS) dy=EPS;
  const scale=Math.min(innerW/dx, innerH/dy);
  const usedW=dx*scale, usedH=dy*scale;
  const ox=padPx+(innerW-usedW)/2, oy=padPx+(innerH-usedH)/2;
  const project=([lng,lat]) => degenerate
    ? {x:width/2,y:height/2}
    : {x:ox+(lng*cos-x0)*scale, y:oy+(y1-lat)*scale};
  const pts=sampled.map(project);
  const pathD = pts.length===1 ? `M ${pts[0].x} ${pts[0].y}`
    : pts.map((p,i)=>`${i===0?'M':'L'} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' ');
  return { pathD, pts, start:pts[0], end:pts[pts.length-1], project };
}
function lerpRoute(coords,t){
  if(coords.length===1) return coords[0];
  let total=0; const segs=[];
  for(let i=0;i<coords.length-1;i++){
    const a=coords[i],b=coords[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]);
    segs.push({a,b,d}); total+=d;
  }
  let remain=total*Math.max(0,Math.min(1,t));
  for(const s of segs){
    if(remain<=s.d || s===segs[segs.length-1]){
      const r=s.d<1e-12?0:remain/s.d;
      return [s.a[0]+(s.b[0]-s.a[0])*r, s.a[1]+(s.b[1]-s.a[1])*r];
    }
    remain-=s.d;
  }
  return coords[coords.length-1];
}
function computeSize(vw, vh, availH, ratio) {
  const A = vw / Math.max(vh, 1);
  const width = Math.min(ratio * vw, Math.max(0, availH) * A);
  const height = width / A;
  return { width, height, aspect: A };
}
function svgMarkup(layout, live, w, h) {
  if (!layout) return '';
  const liveC = live ? `<circle class="route-minimap__live" cx="${live.x}" cy="${live.y}" r="3.5"/>` : '';
  return `<svg class="route-minimap__svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path class="route-minimap__path-outline" d="${layout.pathD}"/>
    <path class="route-minimap__path" d="${layout.pathD}"/>
    <circle class="route-minimap__endpoint route-minimap__endpoint--start" cx="${layout.start.x}" cy="${layout.start.y}" r="3.2"/>
    <circle class="route-minimap__endpoint route-minimap__endpoint--end" cx="${layout.end.x}" cy="${layout.end.y}" r="3.2"/>
    ${liveC}</svg>`;
}
function paint(mm, coords, progress, w, h) {
  const layout = projectRouteMinimap(coords, w, h);
  const live = layout ? layout.project(lerpRoute(coords, progress)) : null;
  mm.style.width = w + 'px';
  mm.style.height = h + 'px';
  mm.innerHTML = svgMarkup(layout, live, w, h);
  return { layout, live };
}
function rect(el){ if(!el) return null; const r=el.getBoundingClientRect(); return {top:r.top,left:r.left,width:r.width,height:r.height,bottom:r.bottom,right:r.right}; }
function overlapY(a,b){ if(!a||!b) return 0; return Math.max(0, Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)); }

const NAMSAN = [[126.988622,37.5486],[126.98856,37.548576],[126.988486,37.548536],[126.988395,37.548517],[126.988304,37.548481],[126.988215,37.54846],[126.988168,37.548391],[126.988083,37.548346],[126.988036,37.548332],[126.987979,37.5483],[126.98791,37.548285],[126.987805,37.548264],[126.987663,37.54826],[126.987533,37.548259],[126.987456,37.548283],[126.987431,37.548291],[126.987386,37.548304],[126.987287,37.54827],[126.98717,37.548241],[126.987102,37.548226],[126.987025,37.548219],[126.986948,37.548224],[126.986897,37.548232],[126.986856,37.54825],[126.986811,37.548286],[126.986772,37.548329],[126.986724,37.548399],[126.986552,37.548703],[126.986491,37.548811],[126.986461,37.548854],[126.986428,37.54888],[126.986402,37.548897],[126.986298,37.548961],[126.986018,37.549137],[126.985633,37.549397],[126.9855,37.549493],[126.985423,37.549534],[126.985242,37.549635],[126.985183,37.549659],[126.985078,37.549709],[126.985013,37.549751],[126.984975,37.549777]];

function buildStage(w, h, dockMode) {
  const stage = document.createElement('section');
  stage.className = 'stage';
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  const dock = dockMode === 'expanded'
    ? `<div class="route-dock-anchor route-dock-anchor--open" id="dock"><div class="route-dock__shell" id="dock-shell">
        <button class="route-dock__caret">◀</button>
        <div class="route-dock__body">경유지 1 · 한강<br/>SENSOR 72 rpm</div></div></div>`
    : `<div class="route-dock-anchor" id="dock"><div class="route-dock__shell" id="dock-shell">
        <button class="route-dock__caret"><span class="route-dock__caret-led"></span></button></div></div>`;
  stage.innerHTML = `
    <div class="map-hud__tl" id="tl">
      <button class="hud-brand" id="brand"><span class="hud-brand__dot"></span>RTW</button>
      <span class="metrics">12.3 / 45.6km · 32:10 · 22.1 · 24</span>
    </div>
    <div class="map-hud__tr">
      <div class="qc"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button></div>
      <span class="account">G Guest</span>
    </div>
    ${dock}
    <div class="route-minimap-anchor" id="mm-anchor"><div class="route-minimap hud-glass" id="mm"></div></div>`;
  document.body.appendChild(stage);
  return stage;
}

function applySized(stage, w, h, coords, progress, ratio) {
  const availH = stage.querySelector('#mm-anchor').clientHeight;
  const sz = computeSize(w, h, availH, ratio);
  paint(stage.querySelector('#mm'), coords, progress, sz.width, sz.height);
  return { sz, availH };
}

function measure(coords) {
  const out = {};
  for (const [key, w, h] of [['m740',740,300],['m1161',1161,870]]) {
    const stage = buildStage(w, h, 'collapsed');
    const { sz } = applySized(stage, w, h, coords, 0.4, MINIMAP_WIDTH_RATIO);
    const full = computeSize(w, h, stage.querySelector('#mm-anchor').clientHeight, MINIMAP_WIDTH_RATIO_FULL);
    const tl = rect(stage.querySelector('#tl'));
    const brand = rect(stage.querySelector('#brand'));
    const dock = rect(stage.querySelector('#dock-shell'));
    const mm = rect(stage.querySelector('#mm'));
    out[key] = {
      viewport:{width:w,height:h},
      minimap: mm,
      areaPct: mm ? (mm.width*mm.height)/(w*h)*100 : null,
      areaAsOneOverN: mm ? (w*h)/(mm.width*mm.height) : null,
      leftPads: { rtw: brand&&brand.left, minimap: mm&&mm.left, dock: dock&&dock.left },
      gapMmBottomToDockTop: mm && dock ? dock.top - mm.bottom : null,
      linearScaleVsFull: { w: sz.width/full.width, h: sz.height/full.height },
      size70: sz, size100: full,
    };
    stage.remove();
  }
  {
    const stage = buildStage(740, 300, 'expanded');
    applySized(stage, 740, 300, coords, 0.4, MINIMAP_WIDTH_RATIO);
    const mm = rect(stage.querySelector('#mm'));
    const dock = rect(stage.querySelector('#dock-shell'));
    out.overlap740 = { mm, dock, overlapPx: overlapY(mm, dock) };
    stage.remove();
  }
  return out;
}

const scene = new URLSearchParams(location.search).get('scene') || 'measure';

(function(){
  const coords = NAMSAN;
  if (scene === 'measure') {
    document.getElementById('measure-out').textContent = JSON.stringify(measure(coords), null, 2);
    return;
  }
  if (scene === 'size-compare') {
    const s = document.createElement('section');
    s.className = 'stage'; s.style.width='740px'; s.style.height='300px';
    const probe = buildStage(740,300,'collapsed');
    const avail = probe.querySelector('#mm-anchor').clientHeight;
    probe.remove();
    const full = computeSize(740,300,avail,MINIMAP_WIDTH_RATIO_FULL);
    const half = computeSize(740,300,avail,MINIMAP_WIDTH_RATIO);
    s.innerHTML = `<div class="cmp-grid">
      <div class="cell"><label>100% (0.42) · ${full.width.toFixed(0)}×${full.height.toFixed(0)}</label>
        <div class="frame"><div class="route-minimap hud-glass" id="mm100" style="left:8px;bottom:8px"></div></div></div>
      <div class="cell"><label>70% (0.294) · ${half.width.toFixed(0)}×${half.height.toFixed(0)}</label>
        <div class="frame"><div class="route-minimap hud-glass" id="mm70" style="left:8px;bottom:8px"></div></div></div>
    </div>`;
    document.body.appendChild(s);
    paint(s.querySelector('#mm100'), coords, 0.4, full.width, full.height);
    paint(s.querySelector('#mm70'), coords, 0.4, half.width, half.height);
    return;
  }
  if (scene === 'riding-740') {
    const s = buildStage(740,300,'collapsed');
    applySized(s,740,300,coords,0.35,MINIMAP_WIDTH_RATIO);
    return;
  }
  if (scene === 'riding-1161') {
    document.documentElement.style.fontSize = '16px';
    const s = buildStage(1161,870,'collapsed');
    applySized(s,1161,870,coords,0.35,MINIMAP_WIDTH_RATIO);
    return;
  }
  if (scene === 'dock-exp') {
    const s = buildStage(740,300,'expanded');
    applySized(s,740,300,coords,0.4,MINIMAP_WIDTH_RATIO);
    const mm = rect(s.querySelector('#mm'));
    const dock = rect(s.querySelector('#dock-shell'));
    document.getElementById('measure-out').textContent = JSON.stringify({overlapPx:overlapY(mm,dock),mm,dock},null,2);
    return;
  }
  if (scene === 'curved-zoom') {
    const s = document.createElement('section');
    s.className = 'stage'; s.style.width='900px'; s.style.height='400px';
    const probe = buildStage(740,300,'collapsed');
    const avail = probe.querySelector('#mm-anchor').clientHeight;
    probe.remove();
    const sz = computeSize(740,300,avail,MINIMAP_WIDTH_RATIO);
    s.innerHTML = `<div class="zoom-wrap"><div class="route-minimap hud-glass" id="mm" style="transform:scale(3);transform-origin:center"></div></div>`;
    document.body.appendChild(s);
    paint(s.querySelector('#mm'), coords, 0.5, sz.width, sz.height);
    return;
  }
  buildStage(740,300,'collapsed');
})();
</script>
</body>
</html>
