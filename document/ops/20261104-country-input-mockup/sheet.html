<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:#f1f5f9;font:14px 'Pretendard Variable',system-ui,sans-serif;color:#0f172a;width:1680px}
h1{font-size:20px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
figure{margin:0;background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px #0002}
figcaption{font-weight:700;margin:0 0 6px}figcaption small{font-weight:400;color:#475569;display:block;margin-top:2px}
img{width:800px;height:360px;display:block;border-radius:6px}
</style></head><body><h1>국가 입력 시안 — 폰 가로 800×360 (주황 점선 = 새로 넣는 곳)</h1><div class="grid">
<figure><figcaption>현재 — 가입 카드<small>스크롤 없음(카드 315px)</small></figcaption><img src="a0-800x360.png"></figure>
<figure><figcaption>A안 — 닉네임과 국가를 한 줄에 (추천)<small>스크롤 없음(339px). 국가는 기기 시간대로 미리 골라 둠, 필수</small></figcaption><img src="a2-800x360.png"></figure>
<figure><figcaption>B안 — 닉네임 아래 국가 줄 따로<small>32px 넘쳐 스크롤 생김</small></figcaption><img src="a-800x360.png"></figure>
<figure><figcaption>프로필 수정 — 닉네임 아래 「국가」 줄 (30일 잠김 상태)<small>닉네임 줄과 같은 꼴. 게스트에게는 줄이 없음</small></figcaption><img src="b-800x360.png"></figure>
<figure><figcaption>기존 Google 사용자 — 다음 접속 때 한 번만<small>「나중에」를 두면 그동안 전세계 순위에만 들어감(결정 필요)</small></figcaption><img src="c-800x360.png"></figure>
</div></body></html>
