<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>지시10 QC HUD harness — phone landscape 13.5px</title>
<style>
  /* 폰 가로 루트 (index.css max-height:560px 와 동일) */
  html { font-size: 13.5px; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 900px;
    height: 400px;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    background: #1a2332;
    color: #f8fafc;
  }
  .map-fake {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, #3d5a40 0%, #2a4a30 40%, #1e3a28 100%);
  }
  .map-fake::after {
    content: "MAP (fake — 클릭 통과 검사 대상)";
    position: absolute; left: 12px; bottom: 12px;
    opacity: 0.45; font-size: 12px;
  }
  .map-hud {
    position: absolute; inset: 0; z-index: 5;
    pointer-events: none;
    --hud-pad: 0.6rem;
    --hud-pad-top: 0.6rem;
    --hud-pad-right: 0.6rem;
  }
  .map-hud > * { pointer-events: auto; }
  .map-hud__tr {
    position: absolute;
    top: var(--hud-pad-top);
    right: var(--hud-pad-right);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.4rem;
    max-width: calc(100vw - var(--hud-pad-right) - 10rem);
  }
  /* === production MapHud.css QC (지시10 150%) === */
  .hud-quick-camera {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    flex-shrink: 0;
    pointer-events: auto !important;
    touch-action: manipulation;
  }
  .hud-quick-camera__btn {
    box-sizing: border-box;
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 2.325rem;
    height: 2.325rem;
    padding: 0 0.42rem;
    margin: 0;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 0.525rem;
    background: rgba(15, 23, 42, 0.55);
    color: #e2e8f0;
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto !important;
    touch-action: manipulation;
  }
  .hud-quick-camera__btn--c1.is-active {
    min-width: 2.775rem;
    height: 2.775rem;
    padding-bottom: 0.18rem;
  }
  .hud-quick-camera__c1-mark {
    margin-top: 0.12rem;
    font-size: 0.72rem;
    font-weight: 700;
    color: #bae6fd;
    line-height: 1;
  }
  .hud-quick-camera__btn.is-active {
    border-color: rgba(125, 211, 252, 0.85);
    background: rgba(14, 116, 144, 0.55);
    color: #f0f9ff;
  }
  .hud-account {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    height: 2.2rem;
    padding: 0 0.7rem 0 0.35rem;
    border-radius: 999px;
    border: 1px solid rgba(248, 250, 252, 0.18);
    background: rgba(15, 23, 42, 0.42);
    color: #f8fafc;
    cursor: pointer;
    pointer-events: auto;
  }
  .hud-account__avatar {
    width: 1.6rem; height: 1.6rem; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: #334155; font-size: 0.75rem; font-weight: 700;
  }
  .hud-account__label { font-size: 0.78rem; white-space: nowrap; }
  .hud-metrics {
    position: absolute; left: 0.6rem; top: 0.6rem;
    display: flex; gap: 0.4rem; font-size: 0.95rem; font-weight: 700;
    text-shadow: 0 0 2px #000, 0 0 2px #000;
  }
  #log {
    position: absolute; left: 8px; top: 48px; z-index: 10;
    font-size: 11px; background: rgba(0,0,0,0.55); padding: 6px 8px;
    max-width: 420px; white-space: pre-wrap; pointer-events: none;
  }
</style>
</head>
<body>
  <div class="map-fake" id="map"></div>
  <div class="map-hud">
    <div class="hud-metrics" id="metrics">
      <span>12.4 km/h</span>
      <span>새 도로 +0.12 km</span>
    </div>
    <div class="map-hud__tr" id="tr">
      <div class="hud-quick-camera" id="qc" role="group" aria-label="Quick Camera">
        <button type="button" class="hud-quick-camera__btn hud-quick-camera__btn--c1 is-active" data-n="1">
          <span>1</span><span class="hud-quick-camera__c1-mark">R</span>
        </button>
        <button type="button" class="hud-quick-camera__btn" data-n="2">2</button>
        <button type="button" class="hud-quick-camera__btn" data-n="3">3</button>
        <button type="button" class="hud-quick-camera__btn is-active" data-n="4">4</button>
        <button type="button" class="hud-quick-camera__btn" data-n="5">5</button>
        <button type="button" class="hud-quick-camera__btn" data-n="6">6</button>
      </div>
      <button type="button" class="hud-account" id="account">
        <span class="hud-account__avatar">G</span>
        <span class="hud-account__label">Guest</span>
      </button>
    </div>
  </div>
  <div id="log">measuring…</div>
  <script>
    const log = document.getElementById('log');
    const map = document.getElementById('map');
    let mapHits = 0;
    let btnHits = 0;
    let gapHits = 0;
    map.addEventListener('pointerdown', () => { mapHits++; }, true);
    const qc = document.getElementById('qc');
    const stop = (e) => e.stopPropagation();
    qc.addEventListener('pointerdown', stop);
    qc.addEventListener('touchstart', stop, { passive: true });
    qc.querySelectorAll('button').forEach((b) => {
      b.addEventListener('pointerdown', stop);
      b.addEventListener('touchstart', stop, { passive: true });
      b.addEventListener('click', () => { btnHits++; });
    });

    function rect(el) { return el.getBoundingClientRect(); }
    const qcR = rect(qc);
    const accR = rect(document.getElementById('account'));
    const metR = rect(document.getElementById('metrics'));
    const overlapAcc =
      !(qcR.right < accR.left || qcR.left > accR.right || qcR.bottom < accR.top || qcR.top > accR.bottom);
    const overlapMet =
      !(qcR.right < metR.left || qcR.left > metR.right || qcR.bottom < metR.top || qcR.top > metR.bottom);
    const clipped = qcR.top < 0 || qcR.right > window.innerWidth || qcR.bottom > window.innerHeight || qcR.left < 0;
    const btns = [...qc.querySelectorAll('button')].map((b) => {
      const r = rect(b);
      return { n: b.dataset.n, w: +r.width.toFixed(1), h: +r.height.toFixed(1), x: +r.x.toFixed(1), y: +r.y.toFixed(1) };
    });
    // gap center between btn 2 and 3
    const b2 = rect(qc.querySelector('[data-n="2"]'));
    const b3 = rect(qc.querySelector('[data-n="3"]'));
    const gapX = (b2.right + b3.left) / 2;
    const gapY = (b2.top + b2.bottom) / 2;
    const hitAtGap = document.elementFromPoint(gapX, gapY);
    gapHits = hitAtGap && (hitAtGap === qc || qc.contains(hitAtGap)) ? 1 : 0;

    const report = {
      viewport: { w: window.innerWidth, h: window.innerHeight, rootPx: parseFloat(getComputedStyle(document.documentElement).fontSize) },
      buttons: btns,
      qcBox: { w: +qcR.width.toFixed(1), h: +qcR.height.toFixed(1), x: +qcR.x.toFixed(1), y: +qcR.y.toFixed(1) },
      account: { w: +accR.width.toFixed(1), h: +accR.height.toFixed(1), x: +accR.x.toFixed(1), y: +accR.y.toFixed(1) },
      overlapAccount: overlapAcc,
      overlapMetrics: overlapMet,
      clipped,
      gapElement: hitAtGap ? (hitAtGap.className || hitAtGap.id || hitAtGap.tagName) : null,
      gapAbsorbedByQc: gapHits === 1,
      gapRem: 0.2,
    };
    log.textContent = JSON.stringify(report, null, 2);
    document.title = 'HARNESS_READY';
    window.__QC_REPORT__ = report;
  </script>
</body>
</html>
