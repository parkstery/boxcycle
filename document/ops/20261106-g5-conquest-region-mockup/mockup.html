<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>G5 지역 화면 시안</title><style>
:root{--ink:#121417;--sub:#5E6472;--line:#e8edf5;--blue:#2455df}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#e9edf3;font-family:'Pretendard Variable','Malgun Gothic',system-ui,sans-serif;color:var(--ink);width:1640px}
h1{font-size:30px;margin:0 0 6px}.note{font-size:20px;color:#9a3412;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
figure{margin:0;background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 6px #0002}
figcaption{font-size:24px;font-weight:700;margin:0 0 10px}figcaption small{display:block;font-weight:400;font-size:19px;color:#475569;margin-top:4px;line-height:1.35}
/* 폰 가로 800×360 을 2배(1600×720)로 그릴 수 없어 한 칸 760×342 에 2배 확대 효과를 주려 zoom 사용 */
.phone{width:760px;height:342px;position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(135deg,#cfe0c8,#d9e6ef 60%,#e8e2cf)}
.phone::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,transparent 0 38px,#fff6 38px 40px)}
.dim{position:absolute;inset:0;background:#0003}
.sheet{position:absolute;right:14px;top:12px;bottom:12px;width:330px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0004;padding:10px 12px;font-size:12px;overflow:hidden}
.sheet h2{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:center;min-height:26px;border-bottom:1px solid var(--line);font-size:11px}
.row b{font-size:20px;color:var(--blue);font-weight:700}.row b i{font-size:11px;font-style:normal;margin-left:2px}
.ctl{display:flex;justify-content:flex-end;gap:4px;padding:3px 0 6px;border-bottom:1px solid var(--line);align-items:center}
.btn{height:26px;padding:0 8px;border:0;border-radius:9px;background:#f2f3f5;color:#4b5365;font:inherit;font-size:12px}
.btn.on{background:var(--blue);color:#fff}
.chip{height:26px;padding:0 8px;border:1px solid #C9D6EE;background:#fff;border-radius:8px;font:inherit;font-size:12px;font-weight:600;color:#2A2E37;display:inline-flex;align-items:center}
.new{outline:2px dashed #f59e0b;outline-offset:2px}
.menu{position:absolute;right:16px;top:98px;width:200px;background:#fff;border:1px solid #C9D6EE;border-radius:10px;box-shadow:0 6px 16px #0003;padding:4px;font-size:12px}
.menu div{display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px}.menu .sel{background:#eef3ff;color:var(--blue);font-weight:700}.menu em{font-style:normal;color:var(--sub)}
.reg{display:grid;grid-template-columns:78px 1fr 62px;gap:6px;align-items:center;height:24px;font-size:11px}
.bar{height:8px;border-radius:4px;background:#e8edf5;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--blue)}
.reg span:last-child{text-align:right;font-weight:700}
.tabs{display:flex;gap:4px;margin:2px 0 6px}.tabs .btn.on{background:#121417}
.lb{display:flex;align-items:center;gap:6px;margin-bottom:6px}.lbrow{display:flex;justify-content:space-between;height:22px;align-items:center;border-bottom:1px solid var(--line);font-size:11px}
.tag{font-size:10px;color:#fff;background:#94a3b8;border-radius:4px;padding:1px 4px}
.zoom{zoom:1}
</style></head><body>
<h1>G5 지역 화면 시안 — 근사 시안</h1>
<p class="note">※ 실제 화면을 캡처한 것이 아니라 크기·꼴만 맞춘 근사 그림입니다(폰 가로 800×360 기준). 주황 점선 = 새로 생기는 곳.</p>
<div class="grid">

<figure><figcaption>① 내 도로망 — 지역 칩(추천)<small>고정79 지역 칩과 같은 「이름 ▾」 꼴. 지역을 고르면 위 큰 숫자가 그 지역 km로 바뀐다. 「전체 도로망/신규 도로만」 줄에 칩 하나만 추가, 창 높이 그대로.</small></figcaption>
<div class="phone"><div class="dim"></div><div class="sheet">
<h2><span>계정</span><span>✕</span></h2>
<div class="row"><span>내 도로망 · 대한민국</span><b>1,234.5<i>km</i></b></div>
<div class="ctl"><span class="chip new">대한민국 ▾</span><button class="btn on">전체 도로망</button><button class="btn">신규 도로만</button></div>
<div class="row"><span>누적</span><span>2,310.4 km · 188회 · 96:40</span></div>
<div class="row"><span>마지막 주행</span><span>11-06 · 28.1km</span></div>
<div class="menu"><div>세계 <em>1,260.2km</em></div><div class="sel">✓ 대한민국 <em>1,234.5km</em></div><div>프랑스 <em>20.1km</em></div><div>일본 <em>5.6km</em></div></div>
</div></div></figure>

<figure><figcaption>② 내 도로망 — 지역별 목록(대안)<small>「내 도로망」 줄을 누르면 국가별 거리 막대 목록이 펼쳐진다. 한눈에 비교는 되지만 창이 더 길어져 스크롤이 생긴다.</small></figcaption>
<div class="phone"><div class="dim"></div><div class="sheet">
<h2><span>내 도로망 · 지역별</span><span>✕</span></h2>
<div class="row"><span>세계</span><b>1,260.2<i>km</i></b></div>
<div class="new" style="padding:4px 2px;margin-top:4px;border-radius:6px">
<div class="reg"><span>대한민국</span><span class="bar"><i style="width:98%"></i></span><span>1,234.5</span></div>
<div class="reg"><span>프랑스</span><span class="bar"><i style="width:8%"></i></span><span>20.1</span></div>
<div class="reg"><span>일본</span><span class="bar"><i style="width:3%"></i></span><span>5.6</span></div>
</div>
<div style="font-size:10px;color:var(--sub);margin-top:6px">국경 근처는 최대 수 km 오차가 있을 수 있어요.</div>
</div></div></figure>

<figure><figcaption>③ 개척 순위 — 범위 버튼 열기<small>고정76 범위 버튼을 개척 탭에서도 그대로 쓴다(세계 → 대륙 → 국가). 개척은 도로 기준이라 「국가 없음·게스트」도 고를 수 있다. 「내 길을 달린 사람 수」는 계속 세계만.</small></figcaption>
<div class="phone"><div class="dim"></div><div class="sheet">
<div class="lb"><button class="btn">거리</button><button class="btn on" style="background:#121417">개척</button><span class="chip new" style="margin-left:auto">대한민국 ▾</span><span class="chip">이번 주 ▾</span></div>
<div class="lbrow"><span>1  라이더A</span><b style="font-size:12px">48.2 km</b></div>
<div class="lbrow"><span>2  라이더B</span><b style="font-size:12px">31.0 km</b></div>
<div class="lbrow"><span>3  라이더C</span><b style="font-size:12px">12.7 km</b></div>
<div class="lbrow" style="background:#eef3ff"><span>7  나</span><b style="font-size:12px">3.1 km</b></div>
<div style="font-size:10px;color:var(--sub);margin-top:6px">새로 개척한 도로가 대한민국 안일 때만 이 순위에 쌓여요.</div>
</div></div></figure>

<figure><figcaption>④ 지금(비교용)<small>지금은 지역을 고를 수 없고 개척 순위 범위는 「세계」 글자뿐.</small></figcaption>
<div class="phone"><div class="dim"></div><div class="sheet">
<h2><span>계정</span><span>✕</span></h2>
<div class="row"><span>내 도로망</span><b>1,260.2<i>km</i></b></div>
<div class="ctl"><button class="btn on">전체 도로망</button><button class="btn">신규 도로만</button></div>
<div class="row"><span>누적</span><span>2,310.4 km · 188회 · 96:40</span></div>
<div class="row"><span>개척 순위 범위</span><span style="font-weight:700">세계</span></div>
</div></div></figure>
</div></body></html>
